function assetView(a,i){return '<div class="asset" tabindex="0" aria-label="'+esc(a.name)+'">'+(a.url?'<img alt="'+esc(a.name)+'" src="'+a.url+'">':'<div class="mini"><div class="mini-lines">'+'<i></i>'.repeat(14)+'</div><div class="mini-side"></div></div><span class="mini-label">'+slot(esc(a.name))+'</span>')+'<button class="asset-remove" data-remove="'+i+'" aria-label="Remove '+esc(a.name)+'">'+icon('close')+'</button></div>';}
function composer(conversation){return '<div class="'+(conversation?'conversation-draft':'')+'"><div class="composer"><div class="asset-list">'+state.assets.map(assetView).join('')+'</div><textarea class="draft" aria-label="Primary draft input" placeholder="{draft_input_placeholder}" rows="'+(conversation?3:2)+'">'+esc(state.draft)+'</textarea><div class="composer-footer">'+btn('plus','add-asset','Add asset')+'<button class="access" data-action="access">'+icon('shield')+'<span>{access_scope}</span></button><div class="spacer"></div><button class="execution" data-action="execution"><span>{execution_option}</span><span class="effort">{level}</span>'+icon('chevron')+'</button>'+btn('mic','record','Alternate input','aria-pressed="'+state.recording+'"')+'<button class="commit" data-action="commit" aria-label="'+(state.busy?'Cancel operation':'Commit draft')+'" '+(!state.draft.trim()&&!state.assets.length&&!state.busy?'disabled':'')+'>'+icon(state.busy?'close':'arrow')+'</button></div></div>'+(!conversation?'<div class="support"><button data-action="project">'+icon('folder')+'<span>{context_selector}</span></button><button data-action="resources">'+icon('book')+'<span>{resources}</span></button><button data-area="capabilities">'+icon('orbit')+'<span>{capabilities}</span></button><button data-action="secondary" aria-label="Open secondary region">'+icon('display')+'</button></div>':'')+'</div>';}
function timeline(){return '<div class="timeline"><div class="timeline-inner"><div class="user-entry">{input_content_01}<br>{input_content_01.supporting_context}</div><div class="content-entry"><p>{primary_content_01.description} {primary_content_01.supporting_details}</p><p>{primary_content_01.continuation} {primary_content_01.additional_context}</p><div class="activity">'+icon('code')+'<span>{activity_summary}</span></div><div class="activity"><details><summary>{process_duration}</summary><p>{process_details}</p></details></div><hr class="content-rule"><p>{primary_content_02.description} {primary_content_02.supporting_details}</p><p>{primary_content_02.continuation} {primary_content_02.additional_context}</p><div class="activity">'+icon('edit')+'<span>{completed_activity_summary}</span></div></div><div class="notice">'+icon('info')+'<span>{constraint_notice.message} · {constraint_notice.recovery}</span></div><div class="user-entry">{input_content_02.description}<br>{input_content_02.context}<br>{input_content_02.additional_details}</div><div class="activity">{completed_process_duration}</div><hr class="content-rule"><div class="content-entry"><p>{result_content.summary}</p><ul>'+[1,2,3,4].map(n=>'<li>{result_content.item_0'+n+'}</li>').join('')+'</ul><p>{result_content.validation}</p><p>{result_content.next_action}</p><div class="entry-actions">'+btn('copy','copy','Copy result')+btn('check','feedback','Result feedback')+btn('more','result-options','Result options')+'</div></div>'+state.messages.map(m=>'<div class="user-entry">'+esc(m.input)+'</div><div class="content-entry"><p>'+esc(m.output)+'</p></div>').join('')+'</div></div>';}
function summary(){return '<aside class="summary-card" aria-label="Related context summary">'+['related_records','outputs','processes','sources'].map((name,i)=>'<section class="summary-group"><h3>'+slot(name)+btn('plus','add-related','Add related item')+'</h3>'+Array.from({length:i===1?3:i===3?4:1},(_,n)=>'<button class="summary-item" data-action="resources">'+icon(['branch','globe','orbit','link'][i])+slot(name+'_item_0'+(n+1))+(i===2?'<span class="summary-status">{status}</span>':'')+'</button>').join('')+'</section>').join('')+'</aside>';}
function resourceBody(){
 const tab=state.tabs.find(t=>t.id===state.activeTab);
 if(tab&&tab.kind!=='start')return '<div class="empty-resource">{resource_identity} · '+esc(slot(tab.title))+'</div><h2 style="font-size:23px;font-weight:400">{resource_heading}</h2><p style="color:var(--muted)">{resource_content.body}</p><p style="color:var(--muted)">{resource_content.supporting_details}</p>';
 return (state.scene===1?'<h2 class="resource-heading">{resource_actions}</h2><div class="quick-tools"><button data-action="resources">'+icon('folder')+'<span class="placeholder">{resource_action_a}</span></button><button data-action="resources">'+icon('chat')+'<span class="placeholder">{resource_action_b}</span></button></div>':'<div class="empty-resource">{related_collection_empty}</div>')+'<h2 class="resource-heading">{suggested_group}</h2><div class="suggestions">'+['box','globe','code','link'].map((name,i)=>'<button class="suggestion" data-resource="'+i+'"><span class="suggestion-icon">'+icon(name)+'</span><span class="suggestion-label">{suggested_resource_0'+(i+1)+'}</span></button>').join('')+'</div>'+(state.scene===1?'<h2 class="resource-heading">{recent_resource_group}</h2>'+[1,2,3,4].map(n=>'<button class="recent" data-resource="'+n+'"><span class="recent-icon">'+icon(n===3?'branch':'globe')+'</span><span><strong>{recent_resource_0'+n+'}</strong><small>{resource_type}</small></span><span class="recent-time">{time}</span></button>').join(''):'');
}
function secondary(){return '<aside class="secondary" aria-label="Secondary work region" '+(!state.secondary?'hidden':'')+'><div class="splitter" tabindex="0" role="separator" aria-orientation="vertical" aria-label="Resize secondary region"></div><div class="tabs">'+state.tabs.map(t=>'<div class="tab '+(t.id===state.activeTab?'active':'')+'">'+icon(t.kind==='start'?'globe':'file')+'<button class="tab-title" data-tab="'+t.id+'">'+esc(slot(t.title))+'</button><button class="tab-close" data-close-tab="'+t.id+'" aria-label="Close '+esc(t.title)+'">'+icon('close')+'</button></div>').join('')+btn('plus','add-tab','Add content tab')+btn('panel','secondary','Hide secondary region')+'</div><div class="resource-toolbar"><div class="history">'+btn('left','resource-back','Previous resource')+btn('right','resource-forward','Next resource')+btn('refresh','reload','Reload resource')+'</div><form class="location" id="location-form"><input id="location" aria-label="Resource location" placeholder="{resource_location}"></form>'+btn('more','resource-options','Resource options')+'</div><div class="resource-body"><div class="resource-inner" id="resource-content">'+resourceBody()+'</div></div></aside>';}
function field(name,type,value){const v=settings[name]??value;return '<div class="config-row"><div class="config-description"><div class="config-label">'+slot(name)+'</div><div class="config-help">'+slot(name+'.description')+'</div></div>'+(type==='toggle'?'<button class="switch" role="switch" data-switch="'+name+'" aria-label="'+name+'" aria-checked="'+v+'"></button>':type==='select'?'<select class="field-select" data-field="'+name+'" aria-label="'+name+'">'+['option_a','option_b','option_c'].map(o=>'<option value="'+o+'" '+(o===v?'selected':'')+'>'+slot(o)+'</option>').join('')+'</select>':type==='path'?'<span class="field-path">{storage_path_placeholder}</span><button class="field-button" data-action="external">{change_action}</button>':'<button class="field-button" data-action="external">{external_action}</button>')+'</div>';}
function configuration(){return '<div class="configuration"><div class="config-content"><h1>'+slot(categoryName(state.category))+'</h1><section class="config-group"><h2>{permission_section}</h2><div class="config-card">'+field('permission_field_01','toggle',true)+field('permission_field_02','toggle',true)+'</div></section><section class="config-group"><h2>{configuration_section}</h2><div class="config-card">'+field('path_field_01','path')+[1,2,3,4,5].map(n=>field('enum_field_0'+n,'select','option_a')).join('')+field('boolean_field_01','toggle',false)+field('action_field_01','action')+field('boolean_field_02','toggle',false)+field('enum_field_06','select','option_a')+field('boolean_field_03','toggle',true)+'</div></section></div></div>';}
function renderMain(){
 if(state.area==='configuration'){$('#main').innerHTML=configuration();return;}
 if(state.area==='capabilities'){$('#main').innerHTML=state.capability===null?'<div class="capability" style="color:var(--muted)">{capability_detail_placeholder}</div>':'<div class="capability"><div class="capability-content"><div class="capability-symbol">'+icon('box')+'</div><h1>{capability_'+String(state.capability+1).padStart(2,'0')+'}</h1><p>{capability_description}</p><div class="capability-status"><span>{connection_status}</span><span>'+(state.connected?'{connected}':'{not_connected}')+'</span></div><button class="connect" data-action="connect">'+(state.connected?'{disconnect_action}':'{connect_action}')+'</button></div></div>';return;}
 const header=state.populated||!state.sidebar||state.secondary;
 $('#main').innerHTML='<section class="primary" aria-label="Primary region">'+(header?'<header class="header">'+(state.populated?btn('edit','new-object','Create object')+btn('folder','project','Parent context'):'')+'<div class="header-title placeholder">'+(state.populated?'{active_object_title}':'{primary_area}')+'</div>'+btn('more','object-options','Object options')+btn('grid','summary','Toggle context summary','aria-expanded="'+state.summary+'"')+'</header>':'')+(state.populated?timeline():'<div class="mode-row"><div class="mode-switch" role="group" aria-label="Exclusive mode">'+['a','b'].map(m=>'<button data-mode="'+m+'" class="'+(state.mode===m?'selected':'')+'" aria-pressed="'+(state.mode===m)+'">'+slot('mode_'+m)+'</button>').join('')+'</div></div><div class="entry-body"><div class="entry-container"><h1>{entry_heading}</h1>'+composer(false)+'</div></div>')+(state.populated?composer(true):'')+(state.summary?summary():'')+'</section>'+secondary();
}
function render(){ $('#shell').dataset.composition=state.scene; $('#shell').classList.toggle('split',state.secondary&&state.area==='workspace');document.querySelectorAll('#rail [data-area]').forEach(b=>b.classList.toggle('selected',b.dataset.area===state.area));$('#scene-select').value=state.scene;renderSidebar();renderMain();bindLocal();}
function closeOverlays(){ $('#more-menu').hidden=true;$('#more-trigger').setAttribute('aria-expanded','false');$('#more-trigger').classList.remove('active');$('#popover').hidden=true; }
function more(force){const open=force??$('#more-menu').hidden;closeOverlays();$('#more-menu').hidden=!open;$('#more-trigger').setAttribute('aria-expanded',open);$('#more-trigger').classList.toggle('active',open);if(open)$('#more-menu').innerHTML=['folder','grid','globe','box','branch','link'].map((name,i)=>'<button role="menuitem" data-overflow="'+i+'">'+icon(name)+'<span>{destination_0'+(i+1)+'}</span>'+(i===1?'<span class="pin">'+icon('pin')+'</span>':'')+'</button>').join('');}
function popover(anchor,names){closeOverlays();const box=$('#popover');box.innerHTML=names.map((name,i)=>'<button data-choice="'+i+'">'+slot(name)+'</button>').join('');box.hidden=false;const r=anchor.getBoundingClientRect();box.style.left=Math.max(8,Math.min(r.left,innerWidth-230))+'px';box.style.top=Math.max(8,Math.min(r.bottom+8,innerHeight-box.offsetHeight-10))+'px';}
function setScene(scene){saveDraft();state.scene=Number(scene);state.area=state.scene===5?'capabilities':state.scene===6?'configuration':'workspace';state.sidebar=[2,5,6].includes(state.scene);state.populated=state.scene===1;state.secondary=[1,3].includes(state.scene);state.summary=state.scene===1;state.assets=state.scene===2?[{name:'asset_01'}]:state.scene===3?[{name:'asset_01'},{name:'asset_02'}]:[];state.draft=state.scene===1?'{draft_content}\n{draft_content.supporting_context}':'';state.messages=[];state.tabs=state.scene===1?[{id:++sequence,title:'context_resource',kind:'detail'},{id:++sequence,title:'resource_start',kind:'start'}]:[{id:++sequence,title:'resource_start',kind:'start'}];state.activeTab=state.tabs.at(-1).id;state.capability=null;state.busy=false;state.request++;closeOverlays();render();if(state.scene===4)more(true);}
function openResource(title='resource_detail'){saveDraft();state.tabs.push({id:++sequence,title,kind:'detail'});state.activeTab=sequence;state.secondary=true;state.area='workspace';render();}
function bindLocal(){
 const draft=$('.draft');if(draft){draft.addEventListener('input',()=>{state.draft=draft.value;$('.commit').disabled=!state.draft.trim()&&!state.assets.length&&!state.busy;});draft.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();commit();}});}
 const search=$('#category-search');if(search)search.addEventListener('input',()=>{let count=0;document.querySelectorAll('[data-category]').forEach(row=>{row.hidden=!row.textContent.toLowerCase().includes(search.value.toLowerCase());if(!row.hidden)count++;});$('.empty-filter').hidden=count>0;});
 const form=$('#location-form');if(form)form.addEventListener('submit',e=>{e.preventDefault();const value=$('#location').value.trim();if(!value)return;const tab=state.tabs.find(t=>t.id===state.activeTab);tab.title=value.slice(0,50);tab.kind='detail';saveDraft();render();toast('{resource_loaded} · prototype');});
 const splitter=$('.splitter');if(splitter){const resize=x=>{const rect=$('#main').getBoundingClientRect();$('.secondary').style.width=Math.max(340,Math.min(rect.width-320,rect.right-x))+'px';};splitter.addEventListener('pointerdown',e=>{e.preventDefault();splitter.setPointerCapture(e.pointerId);const move=ev=>resize(ev.clientX);const up=()=>{splitter.removeEventListener('pointermove',move);splitter.removeEventListener('pointerup',up);};splitter.addEventListener('pointermove',move);splitter.addEventListener('pointerup',up);});splitter.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();resize($('.secondary').getBoundingClientRect().left+(e.key==='ArrowLeft'?-20:20));}});}
}
function commit(){if(state.busy){state.busy=false;state.request++;saveDraft();render();toast('{operation_cancelled}');return;}saveDraft();if(!state.draft.trim()&&!state.assets.length)return;const message={input:state.draft.trim()||'{asset_input}',output:'{operation_running}'};state.messages.push(message);state.populated=true;state.draft='';state.assets=[];state.busy=true;const request=++state.request;render();$('.timeline')?.scrollTo(0,$('.timeline').scrollHeight);setTimeout(()=>{if(request!==state.request)return;state.busy=false;message.output='{result_content_placeholder}';if(state.area==='workspace'&&state.populated){saveDraft();render();$('.timeline')?.scrollTo(0,$('.timeline').scrollHeight);}},850);}
document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b){if(!e.target.closest('#popover'))$('#popover').hidden=true;if(!e.target.closest('#more-menu')){$('#more-menu').hidden=true;$('#more-trigger').setAttribute('aria-expanded','false');}return;}
 if(b.dataset.area){saveDraft();closeOverlays();state.area=b.dataset.area;if(state.area!=='workspace')state.sidebar=true;if(state.area==='capabilities')state.scene=5;if(state.area==='configuration')state.scene=6;render();return;}
 if(b.dataset.mode){saveDraft();state.mode=b.dataset.mode;render();return;}
 if(b.dataset.capability!==undefined){state.capability=Number(b.dataset.capability);render();return;}
 if(b.dataset.category!==undefined){state.category=Number(b.dataset.category);render();return;}
 if(b.dataset.switch){const value=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',value);settings[b.dataset.switch]=value;toast('{preference_saved} · prototype');return;}
 if(b.dataset.remove!==undefined){saveDraft();const a=state.assets.splice(Number(b.dataset.remove),1)[0];if(a?.url)URL.revokeObjectURL(a.url);render();return;}
 if(b.dataset.tab){saveDraft();state.activeTab=Number(b.dataset.tab);render();return;}
 if(b.dataset.closeTab){saveDraft();state.tabs=state.tabs.filter(t=>t.id!==Number(b.dataset.closeTab));if(!state.tabs.length){state.tabs=[{id:++sequence,title:'resource_start',kind:'start'}];state.secondary=false;}if(!state.tabs.some(t=>t.id===state.activeTab))state.activeTab=state.tabs.at(-1).id;render();return;}
 if(b.dataset.resource!==undefined){openResource('resource_0'+(Number(b.dataset.resource)+1));return;}
 if(b.dataset.overflow!==undefined){const n=Number(b.dataset.overflow);closeOverlays();if(n===0){state.area='workspace';state.sidebar=true;render();}else openResource('destination_0'+(n+1));return;}
 if(b.dataset.choice!==undefined){toast(b.textContent+' · {selected}');closeOverlays();return;}
 const a=b.dataset.action;
 if(a==='toggle-sidebar'){saveDraft();state.sidebar=!state.sidebar;render();}
 else if(a==='previous-scene')setScene(state.scene===1?6:state.scene-1);
 else if(a==='next-scene')setScene(state.scene===6?1:state.scene+1);
 else if(a==='more')more();
 else if(a==='secondary'){saveDraft();state.secondary=!state.secondary;state.area='workspace';render();}
 else if(a==='summary'){saveDraft();state.summary=!state.summary;render();}
 else if(a==='new-object'){state.request++;state.busy=false;state.populated=false;state.summary=false;state.draft='';state.assets=[];state.messages=[];render();}
 else if(a==='open-populated'){saveDraft();state.area='workspace';state.populated=true;state.summary=false;if(innerWidth<=650)state.sidebar=false;render();}
 else if(a==='history'){state.area='workspace';state.sidebar=true;render();toast('{recent_group}');}
 else if(a==='resources')openResource();
 else if(a==='add-tab'){saveDraft();state.tabs.push({id:++sequence,title:'resource_start',kind:'start'});state.activeTab=sequence;state.secondary=true;render();}
 else if(a==='add-asset')$('#asset-input').click();
 else if(a==='commit')commit();
 else if(a==='access')popover(b,['access_scope_a','access_scope_b','access_scope_c']);
 else if(a==='execution')popover(b,['execution_option_a','execution_option_b','execution_option_c']);
 else if(a==='project')popover(b,['context_01','context_02','context_03']);
 else if(a==='record'){state.recording=!state.recording;b.classList.toggle('recording',state.recording);b.setAttribute('aria-pressed',state.recording);toast(state.recording?'{alternate_input_active} · visual prototype':'{alternate_input_idle}');}
 else if(a==='connect'){state.connected=!state.connected;render();toast('{connection_state_changed} · prototype');}
 else if(a==='find-context'){if($('#category-search'))$('#category-search').focus();else popover(b,['search_query_placeholder','filter_option_a','filter_option_b']);}
 else if(a==='copy'){try{await navigator.clipboard.writeText('{result_content.summary}');toast('{copied}');}catch{toast('{copy_unavailable}');}}
 else if(a==='reload'){$('#resource-content').innerHTML='<div class="empty-resource" role="status">{resource_loading}</div>';setTimeout(()=>{if($('#resource-content'))$('#resource-content').innerHTML=resourceBody();},500);}
 else if(a==='external')toast('{external_action_placeholder} · prototype');
 else if(a==='resource-back'||a==='resource-forward')toast('{resource_history_empty}');
 else if(a)popover(b,['action_placeholder_a','action_placeholder_b']);
});
document.addEventListener('change',e=>{if(e.target.matches('[data-field]')){settings[e.target.dataset.field]=e.target.value;toast('{preference_saved} · prototype');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const wasOpen=!$('#more-menu').hidden;closeOverlays();if(wasOpen)$('#more-trigger').focus();}if(!$('#more-menu').hidden&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();const items=[...$('#more-menu').querySelectorAll('button')];const index=items.indexOf(document.activeElement);items[(index+(e.key==='ArrowDown'?1:-1)+items.length)%items.length].focus();}});
$('#scene-select').addEventListener('change',e=>setScene(e.target.value));$('#asset-input').addEventListener('change',e=>{saveDraft();for(const f of e.target.files)state.assets.push({name:f.name,url:f.type.startsWith('image/')?URL.createObjectURL(f):null});e.target.value='';render();});
render();
</script>
</body>
</html>
